version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      mineures-et-patches:
        update-types: [minor, patch]
    ignore:
      # TS 7 casse le lint type-aware : typescript-eslint plafonne à <6.1.0
      # tant que l'API programmatique du compilateur n'est pas stable (7.1).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
